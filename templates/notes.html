<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Notes — Personal Portal</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <main class="container">
        <a href="/">← Dashboard</a>

        <h1>Notes</h1>

        <form method="POST" action="/notes" class="card">
            <h2>Новая заметка</h2>

            <p>
                <input
                    type="text"
                    name="title"
                    placeholder="Заголовок"
                    required
                >
            </p>

            <p>
                <textarea
                    name="content"
                    placeholder="Текст заметки"
                    rows="5"
                ></textarea>
            </p>

            <button type="submit">Добавить</button>
        </form>

        {{range .}}
            <div class="card">
                <form method="POST" action="/notes/update">
                    <input type="hidden" name="id" value="{{.ID}}">

                    <p>
                        <input
                            type="text"
                            name="title"
                            value="{{.Title}}"
                            required
                        >
                    </p>

                    <p>
                        <textarea
                            name="content"
                            rows="5"
                        >{{.Content}}</textarea>
                    </p>

                    <button type="submit">Сохранить</button>
                </form>

                <form method="POST" action="/notes/delete">
                    <input type="hidden" name="id" value="{{.ID}}">
                    <button type="submit">Удалить</button>
                </form>
            </div>
        {{else}}
            <p>Заметок пока нет.</p>
        {{end}}
    </main>
</body>
</html>
