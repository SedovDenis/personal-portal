<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Notes — Personal Portal</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <main class="container">
        <a href="/">← Dashboard</a>

        <h1>Notes</h1>

        <form method="POST" action="/notes" class="card">
            <h2>Новая заметка</h2>

            <p>
                <input
                    type="text"
                    name="title"
                    placeholder="Заголовок"
                    required
                >
            </p>

            <p>
                <textarea
                    name="content"
                    placeholder="Текст заметки"
                    rows="5"
                ></textarea>
            </p>

            <label for="folder">Папка</label>

            <select id="folder" name="folder_id" required>
                <option value="">Выберите папку</option>

                {{range .Folders}}
                    <option value="{{.ID}}">{{.Name}}</option>
                {{end}}
            </select>

            <button type="submit">Добавить</button>
        </form>

        {{range .Notes}}
            <div class="card">
                <form method="POST" action="/notes/update">
                    <input type="hidden" name="id" value="{{.ID}}">

                    <small>Создано: {{.CreatedAt.Format "02.01.2006 15:04"}}</small><br>
                    <small>Изменено: {{.UpdatedAt.Format "02.01.2006 15:04"}}</small>

                    <p>
                        <input
                            type="text"
                            name="title"
                            value="{{.Title}}"
                            required
                        >
                    </p>

                    <p>
                        <textarea
                            name="content"
                            rows="5"
                        >{{.Content}}</textarea>
                    </p>

                    <button type="submit">Сохранить</button>
                </form>

                <form method="POST" action="/notes/delete">
                    <input type="hidden" name="id" value="{{.ID}}">
                    <button type="submit">Удалить</button>
                </form>
            </div>
        {{else}}
            <p>Заметок пока нет.</p>
        {{end}}

        <section class="folders">
            <h2>Папки</h2>

            <ul>
                {{range .Folders}}
                    <li>{{.Name}}</li>
                {{else}}
                    <li>Папок пока нет</li>
                {{end}}
            </ul>
        </section>
    </main>
</body>
</html>
